server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hugo fingerprints generated CSS and JavaScript filenames. They are safe
    # to keep in browser and edge caches for a year because every content
    # change produces a new URL.
    location ~* "^/(css|js)/.+\.[0-9a-f]{32,}\.(css|js)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Static images and icons are not all fingerprinted in this project, so
    # use a shorter cache lifetime for them.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Clean Hugo routes resolve to index.html. Keep browsers fresh while
    # allowing Cloudflare to serve the document from the edge for five minutes.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=60" always;
    }
}
