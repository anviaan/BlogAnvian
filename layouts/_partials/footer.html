<footer class="color-bg-subtle border-top py-4 mt-6">
  <div class="container-xl px-3 px-md-4 px-lg-5">
    <nav class="d-flex flex-wrap flex-justify-center mb-3" aria-label="Footer navigation">
      {{- range site.Menus.main -}}
      <a href="{{ .URL | relLangURL }}" class="Link--secondary px-2">{{ .Name }}</a>
      {{- end -}}
    </nav>

    <p class="color-fg-muted f6 text-center mb-0">
      &copy; {{ now.Year }} Anvian. All rights reserved.
    </p>

    <p class="color-fg-muted f6 text-center mb-0 mt-2">
      Powered by
      <a href="https://gohugo.io/" class="Link--secondary">Hugo</a>
    </p>
  </div>
</footer>

{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

  function isDarkMode() {
    const colorMode = document.documentElement.dataset.colorMode;
    return colorMode === "dark" || (colorMode === "auto" && prefersDark.matches);
  }

  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: isDarkMode() ? "dark" : "default"
  });

  await mermaid.run({
    nodes: document.querySelectorAll(".mermaid")
  });
</script>
{{ end }}
